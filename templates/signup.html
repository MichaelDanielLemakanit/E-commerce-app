{% extends "base.html" %}

{% block content %}
<div class="auth-container" style="max-width: 400px; margin: 40px auto; padding: 0 20px;">
    <!-- Addie Store Badge Logo -->
    <div class="as-badge" style="width: 50px; height: 50px; font-size: 1.4rem; background: var(--primary-teal, #00A896); color: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; margin: 0 auto 15px;">
        AS
    </div>
    <h2 style="font-size: 1.3rem; color: var(--primary-teal, #00A896); text-align: center; margin-bottom: 20px;">Owner Portal</h2>

    <div class="auth-card" style="background: #fff; padding: 20px; border-radius: 12px; border: 1px solid var(--border-color, #e0e0e0);">
        <!-- Display error/success messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div style="padding: 10px; border-radius: 6px; margin-bottom: 12px; font-size: 0.85rem; text-align: center;
                          background: {% if category == 'error' or category == 'danger' %}#fee2e2{% else %}#d1fae5{% endif %};
                          color: {% if category == 'error' or category == 'danger' %}#dc2626{% else %}#047857{% endif %};">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form action="{{ url_for('signup') }}" method="POST">
            
            <div style="margin-bottom: 12px;">
                <label>Email</label>
                <input type="email" name="email" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px;">
            </div>
        
            <div style="margin-bottom: 12px;">
                <label>Password</label>
                <input type="password" name="password" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px;">
            </div>
        
            <!-- Ensure your button type is 'submit' -->
            <button type="submit" style="width: 100%; padding: 10px; background: #00A896; color: white; border: none; border-radius: 6px; cursor: pointer;">
                Login
            </button>
        </form>
    </div>
</div>
{% endblock %}
